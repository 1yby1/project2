spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pinganbao_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.project.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 文件上传配置
file:
  upload:
    path: uploads
    url-prefix: http://localhost:8080/files

aliyun:
  pns:
    
    sign-name: ${ALIYUN_SMS_SIGN_NAME:速通互联验证码}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:100001}
    region-id: ${ALIYUN_REGION_ID:cn-hangzhou}

sms:
  code:
    ttl-seconds: 300
    send-interval-seconds: 60
    verify-max-attempts: 5
